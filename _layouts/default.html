<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0a0e13">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">
  {% feed_meta %}
</head>
<body>
  <div class="topline" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="mark">BB</span>
      <span class="brand-text">
        <strong>bugbunny<span class="dim">.eval</span></strong>
        <small>30-day evaluation log</small>
      </span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">log</a>
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
      <a href="https://github.com/{{ site.repo }}" rel="noopener">github</a>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>Jekyll · GitHub Pages</span>
    <span class="sep">/</span>
    <span>© {{ 'now' | date: "%Y" }} r4redrabbit</span>
    <span class="sep">/</span>
    <span>authorised targets only</span>
  </footer>
</body>
</html>
