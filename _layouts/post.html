---
layout: default
---
<article class="post">
  <a class="back" href="{{ '/' | relative_url }}">&larr; all entries</a>

  <header class="post-head">
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    </p>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <nav class="post-foot">
    <a class="btn" href="{{ '/' | relative_url }}">&larr; Back to the hub</a>
    <a class="btn ghost" href="{{ '/feed.xml' | relative_url }}">Subscribe via RSS</a>
  </nav>
</article>
