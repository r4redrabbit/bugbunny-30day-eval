title: "BugBunny.ai: 30-Day Evaluation"
description: "Daily notes from a 30-day test of BugBunny.ai: what scans cost, what they found, and how many alerts held up."
url: "https://r4redrabbit.github.io"
baseurl: "/bugbunny-30day-eval"
repo: "r4redrabbit/bugbunny-30day-eval"
lang: "en"

# Evaluation window used by the landing-page status pill
eval_start: "2026-11-01"
eval_days: 30
markdown: kramdown

plugins:
  - jekyll-feed

permalink: /day/:year/:month/:day/:title/
show_drafts: false

exclude:
  - README.md
  - publish.sh
